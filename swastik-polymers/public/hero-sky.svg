<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Industrial sky with crane">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FB8CC"/>
      <stop offset="0.45" stop-color="#C3D2DE"/>
      <stop offset="1" stop-color="#EAF0F3"/>
    </linearGradient>
    <linearGradient id="boom" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C53B10"/>
      <stop offset="0.5" stop-color="#F2521B"/>
      <stop offset="1" stop-color="#FF6A33"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.55" filter="url(#soft)">
    <ellipse cx="420" cy="250" rx="260" ry="80"/>
    <ellipse cx="640" cy="300" rx="200" ry="64"/>
    <ellipse cx="1180" cy="200" rx="300" ry="90"/>
    <ellipse cx="1320" cy="420" rx="220" ry="70"/>
    <ellipse cx="900" cy="640" rx="320" ry="100"/>
  </g>

  <!-- crane boom: diagonal lattice from bottom-left to upper-right -->
  <g transform="rotate(-27 240 820)">
    <!-- main beam -->
    <rect x="120" y="760" width="1120" height="120" rx="8" fill="url(#boom)"/>
    <!-- top chord -->
    <rect x="120" y="760" width="1120" height="16" fill="#B23410"/>
    <!-- bottom chord -->
    <rect x="120" y="864" width="1120" height="16" fill="#9E2C0C"/>
    <!-- lattice diagonals -->
    <g stroke="#9E2C0C" stroke-width="10" opacity="0.9">
      <line x1="160" y1="776" x2="240" y2="864"/>
      <line x1="320" y1="776" x2="240" y2="864"/>
      <line x1="320" y1="776" x2="400" y2="864"/>
      <line x1="480" y1="776" x2="400" y2="864"/>
      <line x1="480" y1="776" x2="560" y2="864"/>
      <line x1="640" y1="776" x2="560" y2="864"/>
      <line x1="640" y1="776" x2="720" y2="864"/>
      <line x1="800" y1="776" x2="720" y2="864"/>
      <line x1="800" y1="776" x2="880" y2="864"/>
      <line x1="960" y1="776" x2="880" y2="864"/>
      <line x1="960" y1="776" x2="1040" y2="864"/>
      <line x1="1120" y1="776" x2="1040" y2="864"/>
    </g>
    <!-- walkway rail -->
    <rect x="120" y="736" width="1120" height="8" fill="#3A3A3A"/>
    <g stroke="#3A3A3A" stroke-width="6">
      <line x1="200" y1="736" x2="200" y2="760"/>
      <line x1="420" y1="736" x2="420" y2="760"/>
      <line x1="640" y1="736" x2="640" y2="760"/>
      <line x1="860" y1="736" x2="860" y2="760"/>
      <line x1="1080" y1="736" x2="1080" y2="760"/>
    </g>
  </g>

  <!-- hoist cable + hook from boom tip -->
  <g stroke="#2A2A2A" stroke-width="4">
    <line x1="1205" y1="250" x2="1205" y2="560"/>
  </g>
  <path d="M1192 560 q13 40 26 0 q-6 34 -26 34 q-20 0 -26 -34 q13 40 26 0z" fill="#2A2A2A"/>

  <!-- subtle ground haze -->
  <rect x="0" y="880" width="1600" height="120" fill="#EAF0F3" opacity="0.5" filter="url(#soft)"/>
</svg>
